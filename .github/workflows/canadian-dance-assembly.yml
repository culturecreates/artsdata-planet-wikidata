name: Canadian Dance Assembly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 3,9 *"

jobs:
  artsdata-push:
    runs-on: ubuntu-latest
    steps:
      - name: Call Artsdata pipeline action
        uses: culturecreates/artsdata-pipeline-action@v3
        with:
          mode: push
          artifact: canadian-dance-assembly
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          downloadUrl: https://api.artsdata.ca/query?format=jsonld&sparql=https://raw.githubusercontent.com/culturecreates/artsdata-planet-wikidata/refs/heads/main/sparql/canadian-dance-assembly.sparql
