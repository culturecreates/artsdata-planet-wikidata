name: Test TAPA load using SPARQL

on:
  workflow_dispatch:

jobs:
  artsdata-push:
    runs-on: ubuntu-latest
    steps:
      - name: Action setup
        uses: culturecreates/artsdata-pipeline-action@v3
        with:
          mode: push
          artifact: tapa-members-test
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          page-url: "https://api.artsdata.ca/query?format=jsonld&sparql=https://raw.githubusercontent.com/culturecreates/artsdata-planet-wikidata/refs/heads/main/sparql/tapa-members.sparql"
          token: ${{ secrets.GITHUB_TOKEN }}
