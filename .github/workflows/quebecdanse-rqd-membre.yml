name: quebecdanse.org - RQD members

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 3,9 *"

permissions:
  contents: write

jobs:
  query-wikidata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Query Wikidata and store dump
        run: |
          curl -sS -f \
            -H "Accept: text/turtle" \
            -H "User-Agent: artsdata-planet-wikidata/1.0 (https://github.com/culturecreates/artsdata-planet-wikidata)" \
            --data-urlencode "query=$(cat sparql/quebecdanse-rqd-membre.sparql)" \
            --max-time 120 \
            https://query.wikidata.org/sparql \
            -o dumps/quebecdanse-rqd-membre.ttl
          test -s dumps/quebecdanse-rqd-membre.ttl

      - name: Commit updated dump
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add dumps/quebecdanse-rqd-membre.ttl
          git diff --staged --quiet && exit 0

          git commit -m "Update quebecdanse-rqd-membre dump [skip ci]"
          git pull --rebase origin main
          git push origin main

  artsdata-push:
    needs: query-wikidata
    runs-on: ubuntu-latest
    steps:
      - name: Call Artsdata pipeline action
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: push
          artifact: quebecdanse-rqd-membre
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          downloadUrl: https://raw.githubusercontent.com/culturecreates/artsdata-planet-wikidata/refs/heads/main/dumps/quebecdanse-rqd-membre.ttl
