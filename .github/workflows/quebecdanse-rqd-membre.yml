name: quebecdanse.org - RQD members

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 3,9 *"

jobs:
  artsdata-push:
    runs-on: ubuntu-latest
    steps:
      - name: Call Artsdata pipeline action
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: push
          artifact: quebecdanse-rqd-membre
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          downloadUrl: https://api.artsdata.ca/query?format=jsonld&sparql=https://raw.githubusercontent.com/culturecreates/artsdata-planet-wikidata/refs/heads/main/sparql/quebecdanse-rqd-membre.sparql
