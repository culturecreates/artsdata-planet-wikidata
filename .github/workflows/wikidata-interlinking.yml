name: Wikidata Interlinking

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'  # 06:00 UTC on the 1st of every month

permissions:
  contents: write  # needed to commit the dump back to the repo

jobs:
  wikidata-interlinking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query Wikidata for Artsdata entities missing a sameAs link
        run: |
          curl -sS -f \
            -H "Accept: application/ld+json" \
            -H "User-Agent: artsdata-planet-wikidata/1.0 (https://github.com/culturecreates/artsdata-planet-wikidata)" \
            --data-urlencode "query=$(cat sparql/list-all-artsdata-entities-missing-sameas-wikidata-entity.sparql)" \
            --max-time 120 \
            https://query.wikidata.org/sparql \
            -o dumps/list-all-artsdata-entities-missing-sameas-wikidata-entity.jsonld

      - name: Validate JSON-LD output
        run: |
          sudo apt-get install -y jq
          jq empty dumps/list-all-artsdata-entities-missing-sameas-wikidata-entity.jsonld

      - name: Commit updated dump
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add dumps/list-all-artsdata-entities-missing-sameas-wikidata-entity.jsonld
          git diff --staged --quiet || git commit -m "Update Wikidata interlinking report [skip ci]"
          git push

  artsdata-push:
    needs: wikidata-interlinking
    runs-on: ubuntu-latest
    steps:
      - name: Call Artsdata pipeline action
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: push
          artifact: wikidata-interlinking
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          downloadUrl: https://raw.githubusercontent.com/culturecreates/artsdata-planet-wikidata/refs/heads/main/dumps/list-all-artsdata-entities-missing-sameas-wikidata-entity.jsonld