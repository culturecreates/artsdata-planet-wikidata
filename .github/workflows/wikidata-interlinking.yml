name: Wikidata Interlinking

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  wikidata-interlinking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # runs `bundle install` and caches gems automatically

      - name: Query Wikidata for Artsdata entities missing a sameAs link
        run: |
          curl -sS -f \
            -H "Accept: application/ld+json" \
            -H "User-Agent: artsdata-planet-wikidata/1.0 (https://github.com/culturecreates/artsdata-planet-wikidata)" \
            --data-urlencode "query=$(cat sparql/list-all-artsdata-entities-missing-sameas-wikidata-entity.sparql)" \
            --max-time 120 \
            https://query.wikidata.org/sparql \
            -o /tmp/query1.jsonld
          jq empty /tmp/query1.jsonld

      - name: Build type-detection query scoped to found entities
        run: bundle exec ruby scripts/build_type_detection_query.rb /tmp/query1.jsonld sparql/wikidata-type-detection.sparql /tmp/wikidata-type-detection.sparql

      - name: Query Wikidata for entity types
        run: |
          curl -sS -f \
            -H "Accept: application/ld+json" \
            -H "User-Agent: artsdata-planet-wikidata/1.0 (https://github.com/culturecreates/artsdata-planet-wikidata)" \
            --data-urlencode "query=$(cat /tmp/wikidata-type-detection.sparql)" \
            --max-time 120 \
            https://query.wikidata.org/sparql \
            -o /tmp/query2-types.jsonld
          jq empty /tmp/query2-types.jsonld

      - name: Merge into a single JSON-LD dump
        run: bundle exec ruby scripts/merge_jsonld.rb /tmp/query1.jsonld /tmp/query2-types.jsonld dumps/list-all-artsdata-entities-missing-sameas-wikidata-entity.jsonld

      - name: Validate merged JSON-LD
        run: jq empty dumps/list-all-artsdata-entities-missing-sameas-wikidata-entity.jsonld

      - name: Commit updated dump
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add dumps/list-all-artsdata-entities-missing-sameas-wikidata-entity.jsonld
          git diff --staged --quiet || git commit -m "Update Wikidata interlinking report [skip ci]"
          git push

  artsdata-push:
    needs: wikidata-interlinking
    runs-on: ubuntu-latest
    steps:
      - name: Call Artsdata pipeline action
        uses: culturecreates/artsdata-pipeline-action@v4
        with:
          mode: push
          artifact: wikidata-interlinking
          publisher: "${{ secrets.PUBLISHER_URI_GREGORY }}"
          downloadUrl: https://raw.githubusercontent.com/culturecreates/artsdata-planet-wikidata/refs/heads/main/dumps/list-all-artsdata-entities-missing-sameas-wikidata-entity.jsonld